name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependências
        run: flutter pub get

      - name: Criar .env com a chave secreta
        run: echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" > .env

      - name: Gerar código (envied)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analisar código
        run: flutter analyze

      - name: Rodar testes
        run: flutter test